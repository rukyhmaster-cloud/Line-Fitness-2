<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Conta | Line Fitness</title>
<meta name="theme-color" content="#02060E"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{fundo:'#02060E',painel:'#0a1019',borda:'#1a2230',vermelho:'#C50337',vermelhoclaro:'#E0134D',texto2:'#9AA0A6',realce:'#FF5C84'},fontFamily:{display:['Anton','Impact','sans-serif'],sans:['Inter','system-ui','sans-serif']}}}}</script>
<style>
html{background:#02060E;color-scheme:dark}
::placeholder{color:#6b7280;opacity:1}
select option{background:#0a1019;color:#fff}
input:-webkit-autofill,input:-webkit-autofill:focus,select:-webkit-autofill{-webkit-text-fill-color:#fff;caret-color:#fff;box-shadow:0 0 0 1000px #02060E inset;border-color:#2a3344}
*{scrollbar-color:#2a3344 #02060E}::selection{background:#C50337;color:#fff}
body{background:#02060E;color:#fff}:focus-visible{outline:3px solid #FF5C84;outline-offset:3px;border-radius:6px}
.glow{background:radial-gradient(60% 50% at 80% 0%,rgba(197,3,55,.28),transparent 70%),radial-gradient(40% 40% at 0% 100%,rgba(197,3,55,.12),transparent 70%),#02060E}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;padding:.75rem 1.6rem;border-radius:.75rem;font-weight:700;transition:background .25s,transform .25s}
.btn-p{background:#C50337}.btn-p:hover{background:#E0134D;transform:translateY(-2px)}.btn-p:disabled{opacity:.6;cursor:wait;transform:none}
.btn-s{border:2px solid #C50337}.btn-s:hover{background:#C50337}
.campo{width:100%;background:#02060E;border:1px solid #2a3344;border-radius:.75rem;padding:.8rem 1rem;color:#fff;min-height:3rem}.campo[aria-invalid=true]{border-color:#ff5c84}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:.25rem .8rem;font-size:.8rem;font-weight:600;background:#1a2230}.badge.v{background:rgba(197,3,55,.2);color:#FF8FAA}
details>summary{cursor:pointer;list-style:none;min-height:2.75rem;display:flex;align-items:center;gap:.5rem;color:#FF5C84;font-weight:600;font-size:.9rem}details>summary::-webkit-details-marker{display:none}details[open]>summary .sx{transform:rotate(90deg)}.sx{transition:transform .2s;font-size:.7rem}
.tab[aria-selected=true]{background:#C50337;color:#fff;border-color:#C50337}
.marca{min-height:2.5rem;padding:.3rem 1rem;border-radius:999px;border:1px solid #2a3344;font-size:.8rem;font-weight:600;transition:background .2s,border-color .2s}.marca:hover{border-color:#C50337}
.marca[aria-pressed=true]{background:#C50337;border-color:#C50337}.marca[data-st=pulado][aria-pressed=true]{background:rgba(197,3,55,.2);color:#FF8FAA}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="font-sans antialiased glow min-h-screen">
<a href="#principal" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:bg-white focus:text-black focus:px-4 focus:py-2 focus:rounded">Ir para o conteúdo</a>
<header class="sticky top-0 z-40 border-b border-borda bg-fundo/90 backdrop-blur"><div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
 <a href="/" class="flex items-center gap-2" aria-label="Line Fitness, página inicial"><span class="w-1.5 h-7 bg-vermelho rounded-full" aria-hidden="true"></span><span class="font-display text-2xl uppercase">Line Fitness</span></a>
 <div id="usuario" class="flex items-center gap-3 text-sm"></div></div></header>
<main id="principal" class="max-w-5xl mx-auto px-4 py-10" tabindex="-1"></main>

<!-- Painel lateral "Minha Conta" -->
<div id="painel-wrap" class="fixed inset-0 z-50 invisible" aria-hidden="true">
 <div id="painel-ov" class="absolute inset-0 bg-black/70 opacity-0 transition-opacity duration-300"></div>
 <aside id="painel" role="dialog" aria-modal="true" aria-labelledby="painel-t" class="absolute right-0 top-0 h-full w-[88%] max-w-sm bg-painel border-l border-borda p-6 overflow-y-auto translate-x-full transition-transform duration-300">
  <div class="flex items-center justify-between"><h2 id="painel-t" class="font-display uppercase text-2xl">Minha Conta</h2>
   <button id="painel-x" type="button" aria-label="Fechar painel" class="w-11 h-11 grid place-items-center rounded-full border border-borda hover:border-vermelho"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="painel-c" class="mt-6 grid gap-5"></div>
 </aside></div>

<script>
const $=(s,r=document)=>r.querySelector(s),main=$('#principal');
function el(tag,cls,txt,attrs){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;for(const k in attrs||{})e.setAttribute(k,attrs[k]);return e}
async function api(url,corpo){try{const r=await fetch(url,{method:corpo?'POST':'GET',headers:corpo?{'Content-Type':'application/json'}:{},body:corpo?JSON.stringify(corpo):undefined,credentials:'same-origin'});
 const j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,...j}}catch{return{ok:false,status:0,erro:'Não foi possível falar com o servidor. Rode "python3 server.py" e abra o site por http://localhost:8000.'}}}
let eu=null;
async function carregarUsuario(){const r=await api('/api/me');eu=r.ok?r:null;const u=$('#usuario');u.replaceChildren();
 if(eu){const m=el('button','w-11 h-11 grid place-items-center rounded-lg border border-borda hover:border-vermelho',null,{type:'button',id:'abrir-painel','aria-label':'Abrir painel Minha Conta','aria-haspopup':'dialog'});
  m.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';m.onclick=abrirPainel;
  u.append(el('span','text-texto2','Olá, '+eu.nome.split(' ')[0]),m)}
 else u.append(el('a','hover:text-realce font-semibold','Entrar',{href:'#entrar'}),el('a','btn btn-p !min-h-[2.5rem] !py-1.5','Cadastre-se',{href:'#cadastro'}))}
function campo(id,rotulo,tipo,extra){const d=el('div'),l=el('label','text-sm font-medium',rotulo,{for:id}),i=el(tipo==='select'?'select':'input','campo mt-1',null,{id,name:id,'aria-describedby':'e-'+id,...(extra||{})});
 if(tipo!=='select')i.type=tipo;d.append(l,i,el('p','text-realce text-sm mt-1 hidden',null,{id:'e-'+id}));return d}
function erro(id,m){const e=$('#e-'+id),i=$('#'+id);e.textContent=m;e.classList.toggle('hidden',!m);i.setAttribute('aria-invalid',!!m);return !m}
function opcoes(sel,lista){sel.append(el('option',null,'Selecione',{value:''}));lista.forEach(([v,t])=>sel.append(el('option',null,t,{value:v})))}
function caixa(titulo,sub){const s=el('section','max-w-xl mx-auto bg-painel border border-borda rounded-2xl p-6 sm:p-8');s.append(el('h1','font-display uppercase text-4xl',titulo),el('p','text-texto2 mt-2 mb-6',sub));return s}
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function telaLogin(){const s=caixa('Entrar','Acesse sua conta para ver seus treinos da semana.');const f=el('form','grid gap-4',null,{novalidate:''});
 f.append(campo('email','E-mail','email',{autocomplete:'email'}),campo('senha','Senha','password',{autocomplete:'current-password'}));
 const msg=el('p','text-realce text-sm hidden',null,{role:'alert'}),b=el('button','btn btn-p','Entrar'),rod=el('p','text-sm text-texto2 text-center','Ainda não tem conta? ');
 rod.append(el('a','text-realce font-semibold underline','Cadastre-se',{href:'#cadastro'}));f.append(msg,b,rod);
 f.onsubmit=async e=>{e.preventDefault();msg.classList.add('hidden');const v=id=>$('#'+id).value.trim();
  if(![erro('email',EMAIL.test(v('email'))?'':'Informe um e-mail válido.'),erro('senha',$('#senha').value.length<6?'A senha tem pelo menos 6 caracteres.':'')].every(Boolean))return;
  b.disabled=true;const r=await api('/api/login',{email:v('email'),senha:$('#senha').value});b.disabled=false;
  if(!r.ok){msg.textContent=r.erro||'Não foi possível entrar.';msg.classList.remove('hidden');return}location.href='/'};
 s.append(f);main.replaceChildren(s)}

function telaCadastro(){const s=caixa('Crie sua conta','Seus dados servem para montar treinos sob medida para você.');const f=el('form','grid gap-4',null,{novalidate:''});
 f.append(campo('nome','Nome completo','text',{autocomplete:'name'}),campo('email','E-mail','email',{autocomplete:'email'}),campo('telefone','Número de telefone','tel',{autocomplete:'tel',inputmode:'tel',placeholder:'(11) 90000-0000'}),campo('senha','Senha (mínimo 6 caracteres)','password',{autocomplete:'new-password'}));
 f.querySelector('#telefone').addEventListener('input',mascara);
 const g=el('div','grid grid-cols-3 gap-3');g.append(campo('idade','Idade','number',{inputmode:'numeric',min:12,max:100}),campo('peso','Peso (kg)','number',{inputmode:'decimal',step:'0.1',min:30,max:300}),campo('altura','Altura (cm)','number',{inputmode:'numeric',min:100,max:250}));f.append(g);
 const sx=campo('sexo','Sexo','select'),ob=campo('objetivo','Objetivo','select'),nv=campo('nivel','Nível de experiência','select');
 opcoes($('select',sx),[['masculino','Masculino'],['feminino','Feminino'],['nao_informar','Prefiro não informar']]);
 opcoes($('select',ob),[['hipertrofia','Hipertrofia'],['emagrecimento','Emagrecimento'],['condicionamento','Condicionamento']]);
 opcoes($('select',nv),[['iniciante','Iniciante'],['intermediario','Intermediário'],['avancado','Avançado']]);f.append(sx,ob,nv);
 const msg=el('p','text-realce text-sm hidden',null,{role:'alert'}),b=el('button','btn btn-p','Criar conta e gerar meus treinos');f.append(msg,b);
 f.onsubmit=async e=>{e.preventDefault();msg.classList.add('hidden');const v=id=>$('#'+id).value.trim(),n=id=>parseFloat($('#'+id).value);
  const ok=[erro('nome',v('nome').length<2?'Informe seu nome.':''),erro('email',EMAIL.test(v('email'))?'':'Informe um e-mail válido, como nome@email.com.'),
   erro('senha',$('#senha').value.length<6?'A senha precisa ter pelo menos 6 caracteres.':''),erro('telefone',v('telefone').replace(/\D/g,'').length>=10?'':'Informe o telefone com DDD.'),erro('idade',n('idade')>=12&&n('idade')<=100?'':'Idade entre 12 e 100 anos.'),
   erro('peso',n('peso')>=30&&n('peso')<=300?'':'Peso entre 30 e 300 kg.'),erro('altura',n('altura')>=100&&n('altura')<=250?'':'Altura entre 100 e 250 cm.'),
   erro('sexo',v('sexo')?'':'Selecione uma opção.'),erro('objetivo',v('objetivo')?'':'Escolha seu objetivo.'),erro('nivel',v('nivel')?'':'Escolha seu nível.')].every(Boolean);
  if(!ok){$('[aria-invalid=true]').focus();return}
  b.disabled=true;b.textContent='Criando sua conta…';
  const r=await api('/api/register',{nome:v('nome'),email:v('email'),telefone:v('telefone'),senha:$('#senha').value,idade:n('idade'),peso:n('peso'),altura:n('altura'),sexo:v('sexo'),objetivo:v('objetivo'),nivel:v('nivel')});
  b.disabled=false;b.textContent='Criar conta e gerar meus treinos';if(!r.ok){msg.textContent=r.erro||'Não foi possível criar a conta.';msg.classList.remove('hidden');return}
  location.href='/'};
 s.append(f);main.replaceChildren(s)}

const NOMES={segunda:'Segunda',terca:'Terça',quarta:'Quarta',quinta:'Quinta',sexta:'Sexta'},ORDEM=Object.keys(NOMES);
let plano=null,diaAtivo=ORDEM[Math.min(Math.max(new Date().getDay()-1,0),4)];
async function telaTreinos(){
 const cab=el('div','flex flex-wrap items-end justify-between gap-4'),t=el('div');
 t.append(el('h1','font-display uppercase text-4xl sm:text-5xl','Treinos da semana'),el('p','text-texto2 mt-2','Objetivo: '+eu.objetivo+' · nível '+({iniciante:'iniciante',intermediario:'intermediário',avancado:'avançado'})[eu.nivel]));
 const gb=el('button','btn btn-p','Gerar novos treinos');cab.append(t,gb);
 const aviso=el('p','mt-4 text-sm text-texto2',null,{role:'status'}),tabs=el('div','mt-6 flex gap-2 overflow-x-auto pb-2',null,{role:'tablist','aria-label':'Dias da semana'}),lista=el('div','mt-4 grid gap-4',null,{role:'tabpanel',id:'painel',tabindex:'0'});
 main.replaceChildren(cab,aviso,tabs,lista,el('p','mt-10 text-xs text-texto2','Estes treinos são sugestões gerais e não substituem a orientação de um profissional de educação física. Em caso de dor, lesão ou problema de saúde, procure orientação médica antes de treinar.'));
 function mostrar(){plano.execucoes=plano.execucoes||{};aviso.className='mt-4 text-sm text-texto2';aviso.textContent=plano.fonte==='ia'?'Treino montado por inteligência artificial com base no seu perfil.':'Treino montado pelo modelo padrão da Line Fitness com base no seu perfil (a IA não está ativa neste servidor).';
  tabs.replaceChildren();ORDEM.forEach(d=>{const b=el('button','tab shrink-0 min-h-[2.75rem] px-5 rounded-full border border-borda font-semibold text-sm',NOMES[d],{role:'tab','aria-selected':d===diaAtivo,'aria-controls':'painel',id:'tab-'+d,tabindex:d===diaAtivo?0:-1});
   b.onclick=()=>{diaAtivo=d;mostrar()};b.onkeydown=e=>{const i=ORDEM.indexOf(d),k={ArrowRight:1,ArrowLeft:-1}[e.key];if(k){diaAtivo=ORDEM[(i+k+5)%5];mostrar();$('#tab-'+diaAtivo).focus()}};tabs.append(b)});
  const x=plano.dias[diaAtivo];lista.setAttribute('aria-labelledby','tab-'+diaAtivo);lista.replaceChildren(el('h2','font-display uppercase text-2xl text-realce',x.foco));
  x.exercicios.forEach(e=>{const c=el('article','bg-painel border border-borda rounded-2xl p-5'),bd=el('div','mt-3 flex flex-wrap gap-2');
   bd.append(el('span','badge v',e.series+(e.series===1?' série':' séries')),el('span','badge',e.repeticoes+(/\d\s*(s|min)\b/.test(e.repeticoes)?'':' repetições')),el('span','badge','Descanso: '+e.descanso+' s'));
   const d=el('details','mt-3 border-t border-borda pt-1'),sm=el('summary');sm.append(el('span','sx','▶',{'aria-hidden':'true'}),el('span',null,'Como executar'));d.append(sm,el('p','text-texto2 pb-2',e.instrucoes));
   const exd=(plano.execucoes[diaAtivo]=plano.execucoes[diaAtivo]||{}),mk=el('div','mt-3 flex gap-2',null,{role:'group','aria-label':'Marcar exercício'});
   [['concluido','✓ Concluí'],['pulado','Pulei']].forEach(([st,tx])=>{const b=el('button','marca',tx,{type:'button','data-st':st,'aria-pressed':exd[e.nome]===st});
    b.onclick=async()=>{const novo=exd[e.nome]===st?'limpar':st,r=await api('/api/execucao',{dia:diaAtivo,nome:e.nome,status:novo});
     if(!r.ok){aviso.textContent=r.erro||'Não foi possível salvar a marcação.';aviso.className='mt-4 text-sm text-realce';return}
     if(novo==='limpar')delete exd[e.nome];else exd[e.nome]=novo;mk.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',exd[e.nome]===x.dataset.st))};mk.append(b)});
   c.append(el('h3','text-xl font-bold',e.nome),bd,mk,d);lista.append(c)})}
 gb.onclick=async()=>{gb.disabled=true;gb.textContent='Gerando seus treinos…';const r=await api('/api/treinos/gerar',{});gb.disabled=false;gb.textContent='Gerar novos treinos';
  if(!r.ok){aviso.textContent=r.erro||'Não foi possível gerar novos treinos.';aviso.className='mt-4 text-sm text-realce';return}plano=r;mostrar();aviso.append(' Treinos atualizados.')};
 const r=await api('/api/treinos');if(!r.ok){aviso.textContent=r.erro||'Não foi possível carregar seus treinos.';return}plano=r;mostrar()}

function mascara(e){const d=e.target.value.replace(/\D/g,'').slice(0,11),k=d.length>10?7:6;e.target.value=d.length>k?`(${d.slice(0,2)}) ${d.slice(2,k)}-${d.slice(k)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d}
const fmtTel=t=>{const d=(t||'').replace(/\D/g,'');return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length===10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:(t||'Não informado')};

function telaInicio(){const s=el('section','max-w-2xl mx-auto text-center py-8 sm:py-16');
 s.append(el('p','text-realce font-semibold tracking-widest text-sm uppercase','Line Fitness'),el('h1','font-display uppercase text-5xl sm:text-7xl leading-[1.02] mt-3'),
  el('p','text-texto2 text-lg mt-6 max-w-md mx-auto','Treinos da semana montados para o seu objetivo, nível e rotina. Crie sua conta e comece hoje.'));
 const h=s.querySelector('h1');h.append('Bem-vindo à ',el('span','text-vermelho','Line Fitness'));
 const bt=el('div','mt-10 flex flex-col sm:flex-row gap-3 justify-center');bt.append(el('a','btn btn-p sm:min-w-[12rem]','Criar Conta',{href:'#cadastro'}),el('a','btn btn-s sm:min-w-[12rem]','Já sou um aluno',{href:'#entrar'}));
 s.append(bt);main.replaceChildren(s)}

// ----- Painel lateral -----
const pw=$('#painel-wrap'),pov=$('#painel-ov'),pn=$('#painel'),px=$('#painel-x');let abre=null;
async function sair(){await api('/api/logout',{});location.href='/'}
async function abrirPainel(){abre=document.activeElement;pw.classList.remove('invisible');pw.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
 requestAnimationFrame(()=>{pov.classList.replace('opacity-0','opacity-100');pn.classList.remove('translate-x-full')});px.focus();
 const c=$('#painel-c');c.replaceChildren(el('p','text-texto2','Carregando…'));const r=await api('/api/desempenho');preencherPainel(r)}
function fecharPainel(){if(pw.classList.contains('invisible'))return;pov.classList.replace('opacity-100','opacity-0');pn.classList.add('translate-x-full');pw.setAttribute('aria-hidden','true');document.body.style.overflow='';
 setTimeout(()=>pw.classList.add('invisible'),300);if(abre&&document.contains(abre))abre.focus()}
function bloco(titulo){const b=el('section','bg-fundo border border-borda rounded-2xl p-4');b.append(el('h3','text-xs font-semibold tracking-widest uppercase text-texto2',titulo));return b}
function preencherPainel(r){const c=$('#painel-c');c.replaceChildren();
 const id=el('div');id.append(el('p','text-lg font-bold',eu.nome),el('p','text-sm text-texto2 break-all',eu.email));
 const tel=bloco('Telefone');tel.append(el('p','mt-2 text-lg font-semibold',fmtTel(eu.telefone)));
 const des=bloco('Desempenho nos treinos'),tem=r.ok&&r.nota!=null,pct=tem?r.nota*10:0;
 const nota=el('p','mt-2 font-display text-6xl text-realce leading-none');nota.append(tem?String(r.nota):'—',el('span','text-2xl text-texto2','/10'));
 const barra=el('div','mt-4 h-3 rounded-full bg-borda overflow-hidden',null,{role:'progressbar','aria-label':'Desempenho nos treinos','aria-valuemin':0,'aria-valuemax':10,'aria-valuenow':tem?r.nota:0}),preench=el('div','h-full rounded-full bg-vermelho transition-all duration-1000 ease-out',null,{style:'width:0%'});barra.append(preench);
 des.append(nota,barra,el('p','mt-3 text-sm text-texto2',tem?`Último treino: ${NOMES[r.dia]} · ${r.foco}. ${r.feitos} de ${r.total} exercícios concluídos.`:'Marque os exercícios como concluídos ou pulados na aba de treinos para ver sua nota.'));
 const pul=bloco('Aparelhos pulados no último treino');
 if(tem&&r.pulados.length){const w=el('div','mt-3 flex flex-wrap gap-2');r.pulados.forEach(n=>w.append(el('span','badge v',n)));pul.append(w)}
 else pul.append(el('p','mt-2 text-sm text-texto2',tem?'Nenhum exercício pulado. Continue assim!':'Ainda sem registros.'));
 const ac=el('div','grid gap-2'),ver=el('a','btn btn-p','Ver meus treinos',{href:'#treinos'}),sb=el('button','btn btn-s','Sair',{type:'button'});ver.onclick=fecharPainel;sb.onclick=sair;ac.append(ver,sb);
 c.append(id,tel,des,pul,ac);requestAnimationFrame(()=>requestAnimationFrame(()=>{preench.style.width=pct+'%'}))}
pov.onclick=px.onclick=fecharPainel;
pw.addEventListener('keydown',e=>{if(e.key==='Escape')fecharPainel();if(e.key==='Tab'){const f=[...pn.querySelectorAll('a[href],button')].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];
 if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});

async function rota(){const h=location.hash||'#inicio';fecharPainel();await carregarUsuario();
 if(!eu&&h==='#treinos'){location.hash='#entrar';return}
 if(eu&&['#inicio','#entrar','#cadastro'].includes(h)){location.replace('/');return}
 if(h==='#treinos')return telaTreinos();
 (h==='#cadastro'?telaCadastro:h==='#entrar'?telaLogin:telaInicio)();main.focus({preventScroll:true})}
addEventListener('hashchange',rota);rota();
</script>
</body></html>
